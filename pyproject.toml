# FindDocs uruchamia sie z kodu zrodlowego, nie buduje sie z niego pakietu.
# Zaleznosci sa w plikach requirements*.txt, a ten plik trzyma wylacznie
# konfiguracje narzedzi deweloperskich.

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "models"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff specific
    "ANN",           # annotations
    "S",             # bandit
    "PTH",           # pathlib
    "TID",           # tidy imports
]
ignore = [
    "ANN401",   # Any is used deliberately in a few adapter boundaries
    "S101",     # assert is fine in tests, guarded below as well
    "SIM108",   # ternary is not always clearer
    "B008",
    "RUF001",   # ambiguous unicode chars: Polish text is expected
    "RUF002",
    "RUF003",
    # Nazwy statusow dokumentow zawieraja slowo "password", to nie sa hasla.
    "S105",
    # Opcjonalne haki cyklu zycia w klasach bazowych sa celowo puste.
    "B027",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S311", "S105", "S106", "PTH"]
# SQL sklada sie wylacznie z nazw kolumn z listy dozwolonych oraz z wygenerowanych
# znakow zapytania. Wszystkie wartosci przekazujemy jako parametry zapytania.
"src/finddocs/indexing/fts.py" = ["S608"]
"src/finddocs/indexing/repository.py" = ["S608"]
"src/finddocs/search/service.py" = ["S608"]
"src/finddocs/diagnostics/*" = ["S608"]
"tools/**" = ["S101", "ANN", "PTH", "S603", "S607"]
"src/finddocs/demo/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["finddocs"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "pypdfium2",
    "pypdfium2.*",
    "docx",
    "docx.*",
    "xlrd",
    "xlrd.*",
    "olefile",
    "rapidocr_onnxruntime",
    "rapidocr",
    "rapidocr.*",
    "easyocr",
    "msal",
    "keyring",
    "keyring.*",
    "win32crypt",
    "win32com",
    "win32com.*",
    "pythoncom",
    "pywintypes",
    "tokenizers",
    "onnxruntime",
    "onnxruntime.*",
    "torch",
    "transformers",
    "safetensors",
    "safetensors.*",
    "charset_normalizer",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
# Pakiet nie jest instalowany, testy importuja go prosto z katalogu src.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testy wymagajace modelu embeddingow lub OCR",
    "gui: testy wymagajace srodowiska Qt",
    "requires_model: wymaga lokalnego modelu embeddingow",
    "requires_ocr: wymaga dostepnego silnika OCR",
    "requires_office: wymaga zainstalowanego Microsoft Office",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/finddocs"]
branch = true
omit = ["src/finddocs/gui/*"]

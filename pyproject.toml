[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finddocs"
version = "0.1.0"
description = "Lokalna wyszukiwarka dokumentow korporacyjnych z obsluga SharePoint"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Krzysztof Mizgała", email = "krzysztof@mizgala.pl" }]
keywords = ["search", "sharepoint", "ocr", "retrieval", "polish"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Polish",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Indexing",
]

dependencies = [
    "PySide6==6.8.1",
    "pypdfium2==4.30.0",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "xlrd==2.0.1",
    "olefile==0.47",
    "pillow==11.1.0",
    "charset-normalizer==3.4.1",
    "numpy>=1.26,<3",
    "onnxruntime==1.20.1",
    "tokenizers==0.21.0",
    "faiss-cpu==1.9.0.post1",
    "httpx==0.28.1",
    "msal==1.31.1",
    "keyring==25.6.0",
    "pywin32==308; sys_platform == 'win32'",
    "structlog==24.4.0",
]

[project.optional-dependencies]
ocr-rapid = ["rapidocr-onnxruntime==1.4.4"]
ocr-easy = ["easyocr>=1.7.2"]
dev = [
    "pytest==8.3.4",
    "pytest-qt==4.4.0",
    "pytest-cov==6.0.0",
    "mypy==1.14.1",
    "ruff==0.9.2",
    "pyinstaller==6.11.1",
    "types-openpyxl",
    "types-pywin32",
]
export = ["torch>=2.2", "transformers>=4.40", "onnx>=1.16"]

[project.scripts]
finddocs = "finddocs.cli:main"

[project.gui-scripts]
finddocs-gui = "finddocs.gui.app:main"

[project.urls]
Homepage = "https://github.com/KMChris/finddocs"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finddocs = ["resources/*", "resources/**/*", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = [".venv", "build", "dist", "models"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplify
    "RUF",           # ruff specific
    "ANN",           # annotations
    "S",             # bandit
    "PTH",           # pathlib
    "TID",           # tidy imports
]
ignore = [
    "ANN401",   # Any is used deliberately in a few adapter boundaries
    "S101",     # assert is fine in tests, guarded below as well
    "SIM108",   # ternary is not always clearer
    "B008",
    "RUF001",   # ambiguous unicode chars: Polish text is expected
    "RUF002",
    "RUF003",
    # Nazwy statusow dokumentow zawieraja slowo "password", to nie sa hasla.
    "S105",
    # Opcjonalne haki cyklu zycia w klasach bazowych sa celowo puste.
    "B027",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "S311", "S105", "S106", "PTH"]
# SQL sklada sie wylacznie z nazw kolumn z listy dozwolonych oraz z wygenerowanych
# znakow zapytania. Wszystkie wartosci przekazujemy jako parametry zapytania.
"src/finddocs/indexing/fts.py" = ["S608"]
"src/finddocs/indexing/repository.py" = ["S608"]
"src/finddocs/search/service.py" = ["S608"]
"src/finddocs/diagnostics/*" = ["S608"]
"tools/**" = ["S101", "ANN", "PTH", "S603", "S607"]
"src/finddocs/demo/**" = ["S311"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["finddocs"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "faiss",
    "faiss.*",
    "pypdfium2",
    "pypdfium2.*",
    "docx",
    "docx.*",
    "xlrd",
    "xlrd.*",
    "olefile",
    "rapidocr_onnxruntime",
    "easyocr",
    "msal",
    "keyring",
    "keyring.*",
    "win32crypt",
    "win32com",
    "win32com.*",
    "pythoncom",
    "pywintypes",
    "tokenizers",
    "onnxruntime",
    "charset_normalizer",
    "PIL",
    "PIL.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: testy wymagajace modelu embeddingow lub OCR",
    "gui: testy wymagajace srodowiska Qt",
    "requires_model: wymaga lokalnego modelu embeddingow",
    "requires_ocr: wymaga dostepnego silnika OCR",
    "requires_office: wymaga zainstalowanego Microsoft Office",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/finddocs"]
branch = true
omit = ["src/finddocs/gui/*"]
